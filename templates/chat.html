<!DOCTYPE html>
<html>
<head>
  <title>Library Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    h2 {
      color: #333;
    }
    #chatbox {
      width: 100%;
      height: 300px;
      border: 1px solid #ccc;
      background: #fff;
      padding: 10px;
      overflow-y: scroll;
      margin-bottom: 10px;
    }
    .user {
      color: blue;
      margin: 5px 0;
    }
    .bot {
      color: green;
      margin: 5px 0;
    }
    #userInput {
      width: 70%;
      padding: 10px;
    }
    #sendBtn {
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <h2>📚 AI Library Chatbot</h2>
  <div id="chatbox"></div>
  <input type="text" id="userInput" placeholder="Type your message..." />
  <button id="sendBtn">Send</button>

  <script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.onclick = () => {
      const message = userInput.value.trim();
      if (!message) return;

      // Show user's message
      chatbox.innerHTML += `<div class="user"><strong>You:</strong> ${message}</div>`;

      // Send to live Flask backend
      fetch("https://ai-library-chatbot.onrender.com/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      })
      .then(res => res.json())
      .then(data => {
        chatbox.innerHTML += `<div class="bot"><strong>Bot:</strong> ${data.response}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        userInput.value = "";
      })
      .catch(error => {
        chatbox.innerHTML += `<div class="bot"><strong>Bot:</strong> Sorry, something went wrong.</div>`;
      });
    };
  </script>
</body>
</html>
