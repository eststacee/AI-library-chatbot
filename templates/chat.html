<!DOCTYPE html>
<html>
<head>
  <title>Library Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f2f2f2; }
    #chatbox { width: 100%; height: 300px; border: 1px solid #ccc; padding: 10px; background: #fff; overflow-y: scroll; margin-bottom: 10px; }
    #userInput { width: 80%; padding: 10px; }
    #sendBtn { padding: 10px 20px; }
    .bot { color: green; }
    .user { color: blue; }
  </style>
</head>
<body>
  <h2>Library Chatbot</h2>
  <div id="chatbox"></div>
  <input type="text" id="userInput" placeholder="Type your message..." />
  <button id="sendBtn">Send</button>

  <script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.onclick = () => {
      const message = userInput.value;
      if (!message) return;

      chatbox.innerHTML += `<div class="user"><strong>You:</strong> ${message}</div>`;

      fetch("http://127.0.0.1:5000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      })
      .then(res => res.json())
      .then(data => {
        chatbox.innerHTML += `<div class="bot"><strong>Bot:</strong> ${data.response}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        userInput.value = "";
      });
    };
  </script>
</body>
</html>
