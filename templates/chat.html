<!DOCTYPE html>
<html>
<head>
  <title>AI Library Chatbot</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #e6f0ff;
      padding: 30px;
      color: #333;
    }
    h2 {
      text-align: center;
      color: #2b547e;
    }
    #chatbox {
      width: 100%;
      max-width: 700px;
      height: 400px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
      overflow-y: scroll;
    }
    .user, .bot {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      width: fit-content;
      max-width: 90%;
      clear: both;
    }
    .user {
      background: #d0e7ff;
      align-self: flex-end;
      float: right;
    }
    .bot {
      background: #d9ffd9;
      float: left;
    }
    #userInput {
      width: 70%;
      padding: 10px;
      margin-right: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #sendBtn {
      padding: 10px 20px;
      border: none;
      background: #2b547e;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2> AI Library Chatbot</h2>
  <div id="chatbox"></div>
  <div style="text-align: center;">
    <input type="text" id="userInput" placeholder="Ask about a book..." />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.onclick = () => {
      const message = userInput.value.trim();
      if (!message) return;

      chatbox.innerHTML += `<div class="user"><strong>You:</strong> ${message}</div>`;

      fetch("https://ai-library-chatbot.onrender.com/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      })
      .then(res => res.json())
      .then(data => {
        chatbox.innerHTML += `<div class="bot"><strong>Bot:</strong> ${data.response}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        userInput.value = "";
      })
      .catch(() => {
        chatbox.innerHTML += `<div class="bot"><strong>Bot:</strong> Sorry, I couldn’t reach the server.</div>`;
      });
    };
  </script>
</body>
</html>
